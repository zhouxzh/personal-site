<header>超大规模集成电路测试基础</header>
<h1 id="%E6%B5%8B%E8%AF%95%E5%8F%AA%E7%BB%99%E5%87%BA%E5%9D%8F%E8%AF%8A%E6%96%AD%E8%BF%98%E8%A6%81%E5%9B%9E%E7%AD%94%E4%B8%BA%E4%BB%80%E4%B9%88%E5%9D%8F%E5%85%88%E6%9F%A5%E5%93%AA%E9%87%8C">测试只给出“坏”，诊断还要回答“为什么坏、先查哪里”</h1>
<div class="three-questions">
  <div>
    <span class="number">01</span>
    <h3>低良率批次</h3>
    <p>只剩 3 个失效分析名额，怎样从一整批失败芯片中挑出最值得切片的样品？</p>
  </div>
  <div>
    <span class="number">02</span>
    <h3>客户退片</h3>
    <p>故障字典没有命中，而且芯片可能有两个缺陷，怎样保留并排序竞争原因？</p>
  </div>
  <div>
    <span class="number">03</span>
    <h3>首硅扫描链</h3>
    <p>逻辑测试失败但异常沿扫描链传播，压缩 BIST 又只剩签名，怎样恢复位置与时间？</p>
  </div>
</div>
<div class="callout">三节课不是三个算法清单，而是三种诊断现场。每个现场都要交付一份能交给物理失效分析工程师的候选报告。</div>
<footer>第 5 章 · 逻辑诊断</footer>
</section>

<header>超大规模集成电路测试基础</header>

<h1 id="%E6%AF%8F%E8%8A%82%E8%AF%BE%E4%BD%BF%E7%94%A8%E5%90%8C%E4%B8%80%E5%BC%A0%E6%95%99%E5%AD%A6%E6%A8%A1%E6%9D%BF">每节课使用同一张教学模板</h1>
<div class="lesson-template">
  <div><strong>1 · 工单 0–5′</strong><span>先出现一个必须做决定的生产或调试问题。</span></div>
  <div><strong>2 · 概念 5–15′</strong><span>只引入解决该问题需要的对象、定义和图。</span></div>
  <div><strong>3 · 机制 15–24′</strong><span>把一个算法拆成可以口头复述的状态转换。</span></div>
  <div><strong>4 · 手算 24–34′</strong><span>用小型响应表、位流或候选表走完一次。</span></div>
  <div><strong>5 · 边界 34–40′</strong><span>说明方法何时失效，以及报告不能证明什么。</span></div>
  <div><strong>6 · 离堂 40–45′</strong><span>完成一道迁移题，并留下通往下一课的问题。</span></div>
</div>
<div class="formula">
  <span class="formula-label">课堂节奏</span>
  每节课 = 一个故事 + 一张核心图 + 一次手算 + 一个可复核结论
</div>
<footer>第 5 章 · 逻辑诊断</footer>
</section>

<header>超大规模集成电路测试基础</header>
<h1 id="%E4%B8%80%E5%BC%A0%E5%9B%BE%E7%9C%8B%E6%87%82%E6%9C%AC%E7%AB%A0%E4%B8%89%E8%8A%82%E8%AF%BE">一张图看懂本章三节课</h1>
<div class="flow">
  <div class="flow-step">失败响应</div>
  <div class="flow-step">候选生成</div>
  <div class="flow-step">候选排序</div>
  <div class="flow-step">信息恢复</div>
  <div class="flow-step">物理核验</div>
</div>
<div class="grid-3">
  <div class="concept">
    <h3>第一课 · 原因到结果</h3>
    <p>预先模拟故障，用故障字典把真实失败签名映射到候选故障。</p>
  </div>
  <div class="concept">
    <h3>第二课 · 结果到原因</h3>
    <p>从失配输出反推扇入锥，再通过注入、排序和分区解释多缺陷。</p>
  </div>
  <div class="concept">
    <h3>第三课 · 恢复观测</h3>
    <p>扫描链和 BIST 压缩了时间或空间信息，诊断要重新把这些信息找回来。</p>
  </div>
</div>
<p><span class="source">[1] 7.1–7.5 节，印刷页 397–450</span></p>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E5%85%88%E6%A0%A1%E5%87%86%E5%9B%9B%E4%B8%AA%E8%AF%8D%E7%BC%BA%E9%99%B7%E6%95%85%E9%9A%9C%E9%94%99%E8%AF%AF%E5%A4%B1%E6%95%88">先校准四个词：缺陷、故障、错误、失效</h1>
<div class="timeline">
  <div><strong>缺陷</strong><span>硅片上的物理异常：颗粒、开路、短路、薄弱氧化层。</span></div>
  <div><strong>故障</strong><span>为推理而建立的行为模型：固定型、桥接、延迟等。</span></div>
  <div><strong>错误</strong><span>故障被激活后，某个信号或状态偏离正确值。</span></div>
  <div><strong>失效</strong><span>错误传播到可观察输出，使功能或规格不满足。</span></div>
</div>
<div class="callout warning">诊断工具通常输出<strong>逻辑候选</strong>，不是物理缺陷本身。物理原因仍需要切片、显微成像和材料分析确认。</div>
<p><span class="source">概念链依据：[1] 7.1 节，印刷页 397–400</span></p>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E4%B8%89%E5%B1%82%E5%B7%A5%E4%BD%9C%E4%B8%8D%E8%83%BD%E6%B7%B7%E4%B8%BA%E4%B8%80%E8%B0%88">三层工作不能混为一谈</h1>
<div class="figure-explainer">
  <figure>
    <img src="assets/ch05/diagnosis-layers.svg" alt="制造测试、逻辑诊断和物理失效分析的分工" />
  </figure>
  <div class="readout">
    <h3>如何读图</h3>
    <ul>
      <li>测试回答“是否通过”。</li>
      <li>诊断回答“哪些模型内位置能解释失败”。</li>
      <li>物理失效分析回答“硅片里真正发生了什么”。</li>
    </ul>
    <p>越往右，证据越接近物理事实，但检查和设备成本也越高。</p>
  </div>
</div>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E8%AF%8A%E6%96%AD%E8%BE%93%E5%87%BA%E5%BF%85%E9%A1%BB%E5%86%99%E6%88%90%E5%80%99%E9%80%89--%E6%8E%92%E5%90%8D--%E8%AF%81%E6%8D%AE%E8%BE%B9%E7%95%8C">诊断输出必须写成“候选 + 排名 + 证据边界”</h1>
<div class="grid-2">
  <div class="concept">
    <h3>一份不可用的报告</h3>
    <p>“问题在扫描链附近。”</p>
    <p>没有具体候选、没有失败向量、没有排名依据，也没有说明模型遗漏。</p>
  </div>
  <div class="concept">
    <h3>一份可复核的报告</h3>
    <p>候选 `{C17, DFF_42, net_183}`；按可修复向量排序；列出支持的测试向量、未解释输出和可能遗漏的桥接/多缺陷。</p>
  </div>
</div>
<div class="callout question">本章所有方法都围绕同一件事：把“可能是哪里”变成可检查、可比较、可反驳的证据。</div>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-footer="第 5 章 · 逻辑诊断" data-class="divider" data-theme="vlsi-testing" lang="en-US" class="divider" data-marpit-pagination="8" style="--paginate:true;--footer:第 5 章 · 逻辑诊断;--class:divider;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<h1 id="%E7%AC%AC%E4%B8%80%E8%8A%82%E8%AF%BE--45-%E5%88%86%E9%92%9F">第一节课 · 45 分钟</h1>
<h2 id="%E4%BD%8E%E8%89%AF%E7%8E%87%E6%89%B9%E6%AC%A1%E4%B8%AD%E7%9A%84%E9%A6%96%E7%89%87%E5%AE%9A%E4%BD%8D">低良率批次中的首片定位</h2>
<p>从测试判定、失败签名到故障字典与诊断分辨率。</p>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E5%B7%A5%E5%8D%95-1%E4%B8%89%E7%89%87%E5%A4%B1%E6%95%88%E5%88%86%E6%9E%90%E5%90%8D%E9%A2%9D%E8%AF%A5%E7%BB%99%E8%B0%81">工单 1：三片失效分析名额该给谁？</h1>
<div class="storyboard">
  <div class="story-card">
    <span class="scene">Scene 01 · Wafer Sort Room</span>
    <blockquote>“Lot L23 的良率从 91% 掉到 68%。测试机只告诉我们哪些 die 失败，我们却只有三个切片名额。”</blockquote>
    <p class="stakes">交付物不是一句“可能短路”，而是一份候选位置排序，帮助 FA 工程师先检查最有把握的区域。</p>
  </div>
  <div class="scene-facts">
    <div class="scene-fact"><strong>已知</strong><span>无故障门级网表、ATE 测试图形、失败芯片的实际响应。</span></div>
    <div class="scene-fact"><strong>未知</strong><span>真实物理缺陷位置、缺陷机制、是否存在多个根因。</span></div>
    <div class="scene-fact"><strong>约束</strong><span>FA 时间昂贵；算法必须在一夜内缩小搜索区域。</span></div>
  </div>
</div>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E6%B5%8B%E8%AF%95%E5%88%A4%E5%AE%9A%E5%92%8C%E9%80%BB%E8%BE%91%E8%AF%8A%E6%96%AD%E7%9A%84%E8%BE%93%E5%85%A5%E8%BE%93%E5%87%BA%E4%B8%8D%E5%90%8C">测试判定和逻辑诊断的输入、输出不同</h1>
<div class="compare">
  <div class="compare-panel">
    <h3>制造测试</h3>
    <ul>
      <li>输入：测试向量、故障模型、期望响应。</li>
      <li>输出：PASS / FAIL、失败向量、失配输出。</li>
      <li>目标：筛掉坏片，控制逃逸。</li>
      <li>成功标准：高覆盖率、低测试成本。</li>
    </ul>
  </div>
  <div class="compare-panel highlight">
    <h3>逻辑诊断</h3>
    <ul>
      <li>输入：无故障模型、失败芯片响应、已有测试集。</li>
      <li>输出：逻辑位置、故障类型候选及排序。</li>
      <li>目标：指导 FA、设计调试和良率提升。</li>
      <li>成功标准：定位质量、候选数量、运行时间。</li>
    </ul>
  </div>
</div>
<div class="callout">同一条测试向量既能用于判定，也能成为诊断证据；区别在问题是“是否失败”还是“为什么失败”。</div>
<p><span class="source">[1] 7.1 节，印刷页 397–401</span></p>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E8%AF%8A%E6%96%AD%E6%AF%94%E8%BE%83%E7%9A%84%E6%98%AF%E4%B8%80%E5%AF%B9%E6%A8%A1%E5%9E%8B%E8%8A%AF%E7%89%87%E8%BE%93%E5%87%BA">诊断比较的是一对模型/芯片输出</h1>
<div class="definition-box">
  <span class="term">Definition 7.1 · Output Pair</span>
  <strong>输出对 (z<sub>C</sub>, z<sub>F</sub>)</strong>
  <p><code>C</code> 表示 circuit under diagnosis 的无故障模型，<code>F</code> 表示真实失败芯片。相同输入下，对应输出组成一对。</p>
</div>
<div class="definition-box">
  <span class="term">Definition 7.2 · Failing Test Vector</span>
  <strong>失败测试向量</strong>
  <p>只要某个输出对出现不一致，该测试向量就是失败向量；产生不一致的输出称为失配输出。</p>
</div>
<div class="callout warning">失败芯片内部不可直接读取。诊断只能在无故障网表和外部响应之间推理，因此结论始终带模型边界。</div>
<p><span class="source">[1] Definitions 7.1–7.3，印刷页 400 与 406</span></p>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E4%B8%80%E4%B8%AA%E8%8A%AF%E7%89%87%E7%9A%84%E5%AD%97%E8%BF%B9%E6%98%AF%E6%95%B4%E7%BB%84%E5%A4%B1%E9%85%8D%E5%93%8D%E5%BA%94">一个芯片的“字迹”是整组失配响应</h1>
<div class="formula">
  <span class="formula-label">Syndrome</span>
  对每个失败向量 v<sub>i</sub>，记录哪些输出失配以及失配值
</div>
<div class="grid-3">
  <div class="concept">
    <h3>最完整</h3>
    <p>保存每个向量、每个输出的实际值。信息最多，存储也最大。</p>
  </div>
  <div class="concept">
    <h3>较常用</h3>
    <p>保存每个向量、每个失配输出的位型。保留空间区分能力。</p>
  </div>
  <div class="concept">
    <h3>最压缩</h3>
    <p>每个向量只保留通过/失败。查询更快，但可能合并不同候选。</p>
  </div>
</div>
<div class="callout question">诊断算法的第一项选择，不是算法名字，而是：你把芯片的哪些“字迹”保留下来了？</div>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E6%97%A0%E6%95%85%E9%9A%9C%E5%9F%BA%E7%BA%BF%E5%A4%B1%E8%B4%A5%E5%90%91%E9%87%8F%E4%B8%8E%E9%80%9A%E8%BF%87%E5%90%91%E9%87%8F%E9%83%BD%E5%B1%9E%E4%BA%8E%E8%AF%81%E6%8D%AE">无故障基线、失败向量与通过向量都属于证据</h1>
<div class="grid-3">
  <div class="concept">
    <h3>无故障基线 z<sub>C</sub></h3>
    <p>由无故障模型在相同输入下仿真得到。它是所有比较的参照，不是“实际硅片一定正确”的证明。</p>
  </div>
  <div class="concept">
    <h3>失败向量</h3>
    <p>至少一个输出对出现不一致的向量。失败向量定义的是观测事件，不等同于某个故障已经存在。</p>
  </div>
  <div class="concept">
    <h3>通过向量</h3>
    <p>没有输出失配，但可排除会在该向量上产生新失配的候选，因此必须参与候选筛选。</p>
  </div>
</div>
<div class="formula">
  <span class="formula-label">失配输出</span>
  z<sub>C</sub>(v) ≠ z<sub>F</sub>(v) 说明该输出对在该向量下失配
</div>
<p><span class="source">[1] 7.1 节，Definitions 7.1–7.3，印刷页 400、406</span></p>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E8%AF%8A%E6%96%AD%E8%B4%A8%E9%87%8F%E4%B8%8D%E6%98%AF%E5%8D%95%E4%B8%80%E5%88%86%E6%95%B0">诊断质量不是单一分数</h1>
<table>
<thead>
<tr>
<th>指标</th>
<th>回答的问题</th>
<th>可能的误导</th>
</tr>
</thead>
<tbody>
<tr>
<td>诊断分辨率</td>
<td>报告了多少候选？</td>
<td>候选少，但可能全部漏掉真实位置；对纯排名列表没有意义</td>
</tr>
<tr>
<td>首次命中</td>
<td>第一个真实缺陷出现在排名第几？</td>
<td>只对带排名工具有意义</td>
</tr>
<tr>
<td>Top-N 命中</td>
<td>前 N 个候选中命中多少个真实缺陷？</td>
<td>多缺陷芯片要按根因数评价</td>
</tr>
<tr>
<td>成功率</td>
<td>物理检查一次能命中多少芯片？</td>
<td>与允许检查时间和资源有关</td>
</tr>
<tr>
<td>运行时间</td>
<td>是否能在生产决策周期内完成？</td>
<td>快但定位不准没有工程价值</td>
</tr>
</tbody>
</table>
<div class="formula">
  <span class="formula-label">候选集合型工具</span>
  Diagnostic resolution R = |C|，C 为候选集合
</div>
<p class="small">若工具只输出完整排名而不输出候选集合，分辨率没有直接定义；应改用首次命中与 Top-N 命中。</p>
<p><span class="source">[1] 7.1 节，印刷页 400–401</span></p>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E5%80%99%E9%80%89%E5%B0%8F%E4%B8%8E%E8%AF%8A%E6%96%AD%E5%87%86%E6%98%AF%E4%B8%A4%E4%BB%B6%E4%BA%8B">“候选小”与“诊断准”是两件事</h1>
<div class="compare">
  <div class="compare-panel">
    <h3>很窄但错误</h3>
    <p>工具每次都只报告 1 个候选，但真实缺陷很少落在这个候选里。</p>
    <p><strong>分辨率 = 1，准确性很差。</strong></p>
  </div>
  <div class="compare-panel highlight">
    <h3>较宽但可靠</h3>
    <p>工具报告 8 个候选，前三个覆盖大多数真实位置，并给出未解释证据。</p>
    <p><strong>分辨率不是 1，但 FA 队列更有用。</strong></p>
  </div>
</div>
<div class="callout warning">评价诊断工具要同时问：候选是否包含真实根因？排名是否有用？遗漏风险如何表达？</div>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E6%95%85%E9%9A%9C%E5%AD%97%E5%85%B8%E5%85%88%E6%A8%A1%E6%8B%9F%E6%89%80%E6%9C%89%E5%8F%AF%E8%83%BD%E7%9A%84%E5%8E%9F%E5%9B%A0">故障字典：先模拟“所有可能的原因”</h1>
<div class="flow">
  <div class="flow-step">故障集合 F</div>
  <div class="flow-step">测试向量 V</div>
  <div class="flow-step">故障仿真</div>
  <div class="flow-step">响应签名</div>
  <div class="flow-step">失败芯片查表</div>
</div>
<div class="grid-2">
  <div class="concept">
    <h3>优点</h3>
    <p>字典预先建立，单颗芯片查询快；适合固定型故障占主导、设计和测试集相对稳定的量产阶段。</p>
  </div>
  <div class="concept">
    <h3>代价</h3>
    <p>网表或测试集改变可能需要重建；字典只能解释已经建模的故障。</p>
  </div>
</div>
<p><span class="source">[1] 7.2.1 节，印刷页 401–405</span></p>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E5%AD%97%E5%85%B8%E6%9C%89%E4%B8%A4%E4%B8%AA%E6%97%B6%E9%97%B4%E5%B0%BA%E5%BA%A6%E7%A6%BB%E7%BA%BF%E6%9E%84%E5%BB%BA%E5%9C%A8%E7%BA%BF%E6%9F%A5%E8%AF%A2">字典有两个时间尺度：离线构建，在线查询</h1>
<div class="compare">
  <div class="compare-panel">
    <h3>离线阶段</h3>
    <ul>
      <li>固定 CUD、故障模型和测试集。</li>
      <li>对每个建模故障执行故障仿真。</li>
      <li>保存响应签名或构建诊断树。</li>
      <li>成本主要是一次性的仿真时间和存储。</li>
    </ul>
  </div>
  <div class="compare-panel highlight">
    <h3>在线阶段</h3>
    <ul>
      <li>输入一颗失败芯片的观测 syndrome。</li>
      <li>沿字典或诊断树匹配候选。</li>
      <li>输出候选集合或排名。</li>
      <li>成本主要是查询和后续分析。</li>
    </ul>
  </div>
</div>
<div class="callout warning">离线字典不会自动适配网表、测试集或压缩结构的变化。变化后必须重建或重新验证。</div>
<p><span class="source">[1] 7.2.1 节，印刷页 401–403</span></p>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E6%95%85%E9%9A%9C%E5%AD%97%E5%85%B8%E7%9A%84%E5%9F%BA%E6%9C%AC%E8%A7%84%E6%A8%A1">故障字典的基本规模</h1>
<div class="formula">
  <span class="formula-label">完整响应字典</span>
  |D| = O(F × V × O<sub>bits</sub>)
</div>
<div class="grid-3">
  <div class="metric"><h3>F</h3><strong>故障数</strong><p>故障点 × 每点故障类型。</p></div>
  <div class="metric"><h3>V</h3><strong>测试向量数</strong><p>失败与未失败向量都可能参与区分。</p></div>
  <div class="metric"><h3>O</h3><strong>可观察位数</strong><p>主输出与伪输出都计入。</p></div>
</div>
<div class="callout">全扫描把内部节点变成伪输出，但输出位数增加后，完整字典可能比想象中更大。</div>
<p><span class="source">[1] 7.2.1 节，印刷页 401–403</span></p>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E6%8A%8A%E5%80%99%E9%80%89%E7%AD%BE%E5%90%8D%E6%8E%92%E6%88%90%E7%9F%A9%E9%98%B5">把候选签名排成矩阵</h1>
<div class="figure-explainer">
  <figure>
    <img src="assets/ch05/fault-signature.svg" alt="候选故障响应签名矩阵与实测失败签名" />
  </figure>
  <div class="readout">
    <h3>如何读图</h3>
    <ul>
      <li>每一行是一个候选故障在全部向量下的响应。</li>
      <li>第一行是无故障基线，不是候选。</li>
      <li>失败芯片得到一行实测签名，与候选行比较。</li>
    </ul>
    <p>诊断分辨率就是所有签名相同或无法区分的候选组大小。</p>
  </div>
</div>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E6%89%8B%E7%AE%97-1%E5%85%88%E5%9B%BA%E5%AE%9A%E8%A7%82%E6%B5%8B%E5%86%8D%E5%AF%BB%E6%89%BE%E4%B8%80%E8%87%B4%E7%AD%BE%E5%90%8D">手算 1：先固定观测，再寻找一致签名</h1>
<div class="bitstream">
  <span class="label">g = expected</span>0 0 0 0 1<br />
  <span class="label">X = observed</span>0 <span class="fault-bit">1</span> <span class="fault-bit">1</span> 0 1<br />
  <span class="label">mismatch</span>· ↑ ↑ · ·
</div>
<div class="worked-box">
  <div class="worked-step"><b>1</b><p><strong>比较</strong> X 与 g，得到失败向量 v2、v3。</p></div>
  <div class="worked-step"><b>2</b><p><strong>筛选</strong> 候选签名必须至少在相同向量上产生对应的失配。</p></div>
  <div class="worked-step"><b>3</b><p><strong>报告</strong> 不能只报“v2 失败”，还要报失败输出和候选集合。</p></div>
</div>
<div class="callout warning">通过向量也是证据。一个候选若在 X 正常的向量上产生新失配，就不能与完整 syndrome 相符。</div>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E6%89%8B%E7%AE%97-2%E7%9B%B8%E5%90%8C%E7%AD%BE%E5%90%8D%E6%84%8F%E5%91%B3%E7%9D%80%E8%BF%99%E4%B8%80%E6%B5%8B%E8%AF%95%E9%9B%86%E6%97%A0%E6%B3%95%E5%8C%BA%E5%88%86">手算 2：相同签名意味着这一测试集无法区分</h1>
<table>
<thead>
<tr>
<th>候选</th>
<th style="text-align:right">v1</th>
<th style="text-align:right">v2</th>
<th style="text-align:right">v3</th>
<th style="text-align:right">v4</th>
<th style="text-align:right">v5</th>
</tr>
</thead>
<tbody>
<tr>
<td>f5</td>
<td style="text-align:right">0</td>
<td style="text-align:right">1</td>
<td style="text-align:right">1</td>
<td style="text-align:right">0</td>
<td style="text-align:right">1</td>
</tr>
<tr>
<td>f6</td>
<td style="text-align:right">0</td>
<td style="text-align:right">1</td>
<td style="text-align:right">1</td>
<td style="text-align:right">0</td>
<td style="text-align:right">1</td>
</tr>
<tr>
<td>f7</td>
<td style="text-align:right">0</td>
<td style="text-align:right">1</td>
<td style="text-align:right">0</td>
<td style="text-align:right">0</td>
<td style="text-align:right">1</td>
</tr>
</tbody>
</table>
<p>实测签名与 f5 一致，但 f6 也完全一致，因此候选集合不是 <code>{f5}</code>，而是：</p>
<div class="candidate-strip">
  <span class="candidate keep">f5</span>
  <span class="candidate keep">f6</span>
  <span class="candidate drop">f7</span>
</div>
<div class="formula">
  <span class="formula-label">诊断分辨率</span>
  R = |{f5, f6}| = 2
</div>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E7%AD%89%E4%BB%B7%E6%94%AF%E9%85%8D%E5%92%8C%E5%BD%93%E5%89%8D%E6%B5%8B%E8%AF%95%E9%9B%86%E4%B8%8B%E4%B8%8D%E5%8F%AF%E5%8C%BA%E5%88%86%E4%B8%8D%E6%98%AF%E4%B8%80%E5%9B%9E%E4%BA%8B">等价、支配和“当前测试集下不可区分”不是一回事</h1>
<div class="grid-3">
  <div class="concept">
    <h3>故障等价</h3>
    <p>两个故障对所有可能输入产生完全相同的无故障/故障输出关系，可以在故障集合中折叠。</p>
  </div>
  <div class="concept">
    <h3>故障支配</h3>
    <p>检测某个故障的测试集合也覆盖另一个故障时，后者在前者被检测的条件下不必单独考虑。</p>
  </div>
  <div class="concept">
    <h3>诊断等价</h3>
    <p>两个故障在当前测试集下签名相同。换一组向量后可能被区分，因此这种等价是相对于 V 的。</p>
  </div>
</div>
<div class="formula">
  <span class="formula-label">关键区别</span>
  物理模型等价 ≠ 当前测试集不可区分
</div>
<p><span class="source">[1] 7.2.1 节与例 7.1，印刷页 402–405</span></p>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E8%AF%8A%E6%96%AD%E6%A0%91%E6%8A%8A%E5%80%99%E9%80%89%E9%9B%86%E5%90%88%E4%B8%80%E5%B1%82%E5%B1%82%E5%88%87%E5%BC%80">诊断树把候选集合一层层切开</h1>
<div class="flow">
  <div class="flow-step">全部候选</div>
  <div class="flow-step">v2 是否失配？</div>
  <div class="flow-step">v3 是否失配？</div>
  <div class="flow-step">v4 模式</div>
  <div class="flow-step">叶子 = 等价类</div>
</div>
<div class="grid-2">
  <div class="concept">
    <h3>树的意义</h3>
    <p>每个测试向量回答一个“是/否”问题，沿分支不断缩小候选集合。</p>
  </div>
  <div class="concept">
    <h3>叶子不是唯一故障</h3>
    <p>若测试集不足以区分两个故障，它们会落在同一个叶子，形成诊断等价类。</p>
  </div>
</div>
<div class="callout question">如果树太浅，问题不是树画得不好，而是测试证据本身不够。</div>
<p><span class="source">[1] 7.2.1 节，诊断树与字典压缩，印刷页 403–405</span></p>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E8%AF%8A%E6%96%AD%E6%A0%91%E5%AE%9E%E4%BE%8B%E6%AF%8F%E4%B8%AA%E5%88%86%E6%94%AF%E9%83%BD%E6%98%AF%E4%B8%80%E6%AC%A1%E8%AF%81%E6%8D%AE%E6%A3%80%E6%9F%A5">诊断树实例：每个分支都是一次证据检查</h1>
<div class="bitstream">
  <span class="label">full set</span>{f1, f2, f3, f4, f5}<br />
  <span class="label">v1 = 0?</span>{f1, f4, f5} | {f2, f3}<br />
  <span class="label">next test</span>继续按 v2、v3、v4 的响应分裂
</div>
<div class="worked-box">
  <div class="worked-step"><b>1</b><p><strong>检查 v1</strong> 只按该输出值把全部候选分成两个组。</p></div>
  <div class="worked-step"><b>2</b><p><strong>沿匹配分支</strong> 继续检查下一个能区分当前组的向量。</p></div>
  <div class="worked-step"><b>3</b><p><strong>到达叶子</strong> 叶子可以只有一个故障，也可能是一组诊断等价故障。</p></div>
</div>
<div class="callout">观测签名 <code>0 1 1 0 1</code> 沿诊断树最终只能到达 f5；这是教材例 7.1 的模型内结论。</div>
<p><span class="source">[1] 7.2.1 节，例 7.1 与图 7.2，印刷页 402–403</span></p>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E4%BB%8E%E5%AE%8C%E6%95%B4%E5%93%8D%E5%BA%94%E5%88%B0%E9%80%9A%E8%BF%87%E5%A4%B1%E8%B4%A5%E5%AD%97%E5%85%B8%E5%AD%98%E5%82%A8%E4%B8%8B%E9%99%8D%E4%BF%A1%E6%81%AF%E4%B9%9F%E4%B8%8B%E9%99%8D">从完整响应到通过/失败字典：存储下降，信息也下降</h1>
<div class="compare">
  <div class="compare-panel">
    <h3>完整响应</h3>
    <p>保留每个向量、每个输出的 0/1，因此能区分“哪个输出错了”。</p>
    <div class="formula">O(F × V × O<sub>bits</sub>)</div>
  </div>
  <div class="compare-panel highlight">
    <h3>通过/失败字典</h3>
    <p>只保留向量级失败标志，多个不同输出模式会被压成同一列。</p>
    <div class="formula">O(F × V)</div>
  </div>
</div>
<div class="misconception">
  <strong>常见误解：</strong>字典越小，只是查询越快，分辨率不变。事实是，过度压缩可能把原本可区分的候选合并。
</div>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E6%A3%80%E6%B5%8B%E5%AD%97%E5%85%B8%E5%8F%AA%E8%AE%B0%E5%BD%95%E4%BD%95%E6%97%B6%E5%93%AA%E4%BA%9B%E4%BD%8D%E5%A4%B1%E8%B4%A5">检测字典只记录“何时、哪些位失败”</h1>
<div class="compare">
  <div class="compare-panel">
    <h3>检测信息</h3>
    <p>每个故障记录形如：</p>
    <div class="formula">t1:10, t2:10, t4:10</div>
    <p>表示该故障在这些测试编号和输出位型上产生失败。</p>
  </div>
  <div class="compare-panel highlight">
    <h3>drop-on-k</h3>
    <p>收集到 k 个失败记录后停止继续保存，降低字典规模。</p>
    <p>代价是某些原本可区分的候选可能被合并。</p>
  </div>
</div>
<div class="formula">
  <span class="formula-label">检测字典规模量级</span>
  O(F · log V · k · O)
</div>
<p><span class="source">[1] 例 7.4，印刷页 405</span></p>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E5%8E%8B%E7%BC%A9%E4%B8%8E%E5%90%88%E5%B9%B6%E6%98%AF%E4%B8%A4%E4%B8%AA%E4%B8%8D%E5%90%8C%E7%9B%AE%E6%A0%87">压缩与合并是两个不同目标</h1>
<div class="grid-2">
  <div class="concept">
    <h3>Compression · 压缩</h3>
    <p>减少存储或传输形式，但不降低已建模故障的诊断分辨率。目标等价信息。</p>
  </div>
  <div class="concept">
    <h3>Compaction · 合并</h3>
    <p>用更少信息换取更小字典，允许不同故障落入同一响应组。目标可接受损失。</p>
  </div>
</div>
<div class="callout">工程问题不是“字典能否更小”，而是“在允许的候选组大小下，字典最小能到多少”。</div>
<p><span class="source">[1] 7.2.1.1 节，印刷页 403–405</span></p>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E9%80%89%E6%8B%A9%E6%80%A7%E6%81%A2%E5%A4%8D%E8%BE%93%E5%87%BA%E5%88%97%E6%98%AF%E6%8A%98%E4%B8%AD%E6%96%B9%E6%A1%88">选择性恢复输出列是折中方案</h1>
<div class="workflow">
  <div class="flow">
    <div class="flow-step">从通过/失败字典开始</div>
    <div class="flow-step">找出仍不可区分的故障组</div>
    <div class="flow-step">恢复最有价值的输出列</div>
    <div class="flow-step">重新计算分辨率</div>
  </div>
</div>
<div class="grid-3">
  <div class="concept"><h3>恢复什么</h3><p>能拆开最大等价类的输出位，而不是任意丢失的输出位。</p></div>
  <div class="concept"><h3>何时停止</h3><p>候选组大小满足 FA 队列需要，或达到存储上限。</p></div>
  <div class="concept"><h3>如何验收</h3><p>用原始完整字典对照，确认恢复后的组确实被拆开。</p></div>
</div>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E5%80%99%E9%80%89%E6%8E%92%E5%90%8D%E4%B8%8D%E7%AD%89%E4%BA%8E%E6%A6%82%E7%8E%87%E5%88%86%E5%B8%83">候选排名不等于概率分布</h1>
<div class="compare">
  <div class="compare-panel">
    <h3>字典排名能表达</h3>
    <ul>
      <li>哪个候选的签名与观测更一致。</li>
      <li>哪些候选已被某些测试向量排除。</li>
      <li>物理失效分析应先检查谁。</li>
    </ul>
  </div>
  <div class="compare-panel highlight">
    <h3>字典排名不能直接表达</h3>
    <ul>
      <li>候选是真实缺陷的统计概率。</li>
      <li>未建模的桥接或多缺陷概率。</li>
      <li>制造工艺、版图或封装因素造成的先验。</li>
    </ul>
  </div>
</div>
<div class="callout warning">除非额外建立并验证概率模型，否则排名只是一条可解释的检查顺序，不是“候选 A 有 80% 概率”。</div>
<p><span class="source">[1] 7.1–7.2.1 节，印刷页 400–405</span></p>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E7%AC%AC%E4%B8%80%E8%AF%BE%E7%BB%93%E8%AE%BA%E5%AD%97%E5%85%B8%E7%BB%99%E5%87%BA%E7%9A%84%E6%98%AF%E6%A8%A1%E5%9E%8B%E5%86%85%E6%9C%80%E5%83%8F%E8%B0%81">第一课结论：字典给出的是“模型内最像谁”</h1>
<div class="takeaways">
  <li>测试把芯片变成 PASS/FAIL；诊断把失败响应变成候选集合。</li>
  <li>失败签名必须与无故障基线共同解释，正常向量也属于证据。</li>
  <li>完整字典查询快但存储大；通过/失败字典更小但可能增加等价候选组。</li>
  <li>分辨率只描述候选组大小，准确性还取决于真实缺陷是否落在候选里。</li>
  <li>故障字典只能解释已建模的故障，不能自动覆盖桥接、多缺陷或未建模机制。</li>
</div>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E7%A6%BB%E5%A0%82%E9%A2%98-1%E7%BB%99-fa-%E5%86%99%E7%AC%AC%E4%B8%80%E5%B0%81%E9%82%AE%E4%BB%B6">离堂题 1：给 FA 写第一封邮件</h1>
<div class="exit-card">
  <h2>用 5 行完成一份候选报告</h2>
  <ol>
    <li>失败向量与失配输出是什么？</li>
    <li>候选集合与诊断分辨率是什么？</li>
    <li>哪个正常向量提供了排除证据？</li>
    <li>哪一个候选是等价类，不能强行二选一？</li>
    <li>字典模型遗漏了哪一类缺陷？</li>
  </ol>
</div>
<div class="callout question">下一课：如果失败签名完全不在字典里，而且真实芯片有两个缺陷，结果到原因的推理如何继续？</div>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-footer="第 5 章 · 逻辑诊断" data-class="divider" data-theme="vlsi-testing" lang="en-US" class="divider" data-marpit-pagination="32" style="--paginate:true;--footer:第 5 章 · 逻辑诊断;--class:divider;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<h1 id="%E7%AC%AC%E4%BA%8C%E8%8A%82%E8%AF%BE--45-%E5%88%86%E9%92%9F">第二节课 · 45 分钟</h1>
<h2 id="%E9%80%80%E5%9B%9E%E8%8A%AF%E7%89%87%E4%B8%AD%E7%9A%84%E5%A4%9A%E7%BC%BA%E9%99%B7%E4%B8%8E%E5%80%99%E9%80%89%E6%8E%92%E5%BA%8F">退回芯片中的多缺陷与候选排序</h2>
<p>从结构裁剪、反向追踪、注入评估到诊断 ATPG。</p>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E5%B7%A5%E5%8D%95-2%E5%AD%97%E5%85%B8%E6%B2%A1%E5%91%BD%E4%B8%AD%E8%80%8C%E4%B8%94%E6%8A%A5%E8%A1%A8%E6%98%BE%E7%A4%BA%E4%B8%A4%E4%B8%AA%E5%BC%82%E5%B8%B8%E5%8C%BA">工单 2：字典没命中，而且报表显示两个异常区</h1>
<div class="storyboard">
  <div class="story-card">
    <span class="scene">Scene 02 · Customer Return Lab</span>
    <blockquote>“同一颗退回芯片在六条向量上失败，但没有一条故障字典签名完全匹配。客户认为是设计问题，制造团队认为是封装缺陷。”</blockquote>
    <p class="stakes">这次不能再假定只有一个固定型故障。任务是生成竞争候选、解释哪些输出被修复，并设计新的区分实验。</p>
  </div>
  <div class="scene-facts">
    <div class="scene-fact"><strong>已知</strong><span>全扫描后的失败位图；两个失配输出来自不同功能路径。</span></div>
    <div class="scene-fact"><strong>未知</strong><span>单缺陷还是多缺陷；是否桥接；两个异常区是否共享扇入。</span></div>
    <div class="scene-fact"><strong>风险</strong><span>按一个缺陷硬解释，可能制造错误候选或遗漏真实根因。</span></div>
  </div>
</div>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E6%9C%AC%E8%AF%BE%E7%9B%AE%E6%A0%87%E4%BB%8E%E5%80%99%E9%80%89%E5%8C%BA%E5%9F%9F%E8%B5%B0%E5%88%B0%E5%8F%AF%E6%8E%92%E5%BA%8F%E5%81%87%E8%AE%BE">本课目标：从“候选区域”走到“可排序假设”</h1>
<div class="lecture-roadmap">
  <div>结构裁剪</div>
  <div>反向追踪</div>
  <div>注入评估</div>
  <div>诊断分区</div>
  <div>主动区分</div>
</div>
<div class="exercise">
  <h3>离堂能力</h3>
  <p>给定一份失败响应和一个小网表，先说明单故障假设为何失败，再用结构裁剪、注入评分和诊断向量保留至少两个竞争原因。</p>
</div>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E6%95%85%E9%9A%9C%E5%AD%97%E5%85%B8%E5%A4%B1%E8%B4%A5%E5%B9%B6%E4%B8%8D%E7%AD%89%E4%BA%8E%E8%8A%AF%E7%89%87%E6%97%A0%E6%95%85%E9%9A%9C">故障字典失败并不等于芯片无故障</h1>
<div class="grid-3">
  <div class="concept">
    <h3>模型外缺陷</h3>
    <p>阻性桥接、间歇性开路或多缺陷可能产生字典中没有的签名。</p>
  </div>
  <div class="concept">
    <h3>设计或测试集改变</h3>
    <p>旧字典不再对应新网表、新测试顺序或压缩结构。</p>
  </div>
  <div class="concept">
    <h3>多缺陷混合</h3>
    <p>两个故障共同作用，不必对应任何单故障行。</p>
  </div>
</div>
<div class="callout">因果反演适合字典未命中的情况：它不要求失败效应完整存在于预先模拟的固定型故障集合中。</div>
<p><span class="source">[1] 7.2.2 节，印刷页 405–407</span></p>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E5%8E%9F%E5%9B%A0%E5%88%B0%E7%BB%93%E6%9E%9C-vs-%E7%BB%93%E6%9E%9C%E5%88%B0%E5%8E%9F%E5%9B%A0">原因到结果 vs 结果到原因</h1>
<div class="compare">
  <div class="compare-panel">
    <h3>Cause–Effect</h3>
    <ol>
      <li>先假设故障。</li>
      <li>仿真每个故障。</li>
      <li>保存响应。</li>
      <li>失败时查表。</li>
    </ol>
    <p><strong>存储换查询速度。</strong></p>
  </div>
  <div class="compare-panel highlight">
    <h3>Effect–Cause</h3>
    <ol>
      <li>先观察失败效应。</li>
      <li>在无故障网表上反推。</li>
      <li>动态构造并评估候选。</li>
      <li>必要时生成新向量。</li>
    </ol>
    <p><strong>计算换模型灵活性。</strong></p>
  </div>
</div>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E5%85%88%E5%A3%B0%E6%98%8E%E6%95%85%E9%9A%9C%E5%81%87%E8%AE%BE%E9%98%B6%E6%95%B0%E5%86%8D%E9%80%89%E6%8B%A9%E7%AE%97%E6%B3%95">先声明故障假设阶数，再选择算法</h1>
<div class="grid-3">
  <div class="concept">
    <h3>单故障</h3>
    <p>所有失配由一个根因解释；多个失配输出扇入锥取交集，分辨率高但假设强。</p>
  </div>
  <div class="concept">
    <h3>多故障</h3>
    <p>不同失配可由不同根因解释；先用并集保留候选，再尝试分区和原因消解。</p>
  </div>
  <div class="concept">
    <h3>多重项 / 桥接</h3>
    <p>一个物理桥接可能涉及多个信号，单个固定型故障不足以表达其行为。</p>
  </div>
</div>
<div class="callout warning">算法结果不能脱离假设解读。“只报一个候选”可能来自强假设，不来自芯片证据充分。</div>
<p><span class="source">[1] 7.2.2–7.2.5 节，印刷页 405–427</span></p>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="d-%E7%AC%A6%E5%8F%B7%E5%90%8C%E4%B8%80%E4%B8%AA%E9%80%BB%E8%BE%91%E5%80%BC%E5%AF%B9%E8%B1%A1%E5%90%8C%E6%97%B6%E8%AE%B0%E5%BD%95%E4%B8%A4%E6%9D%A1%E7%94%B5%E8%B7%AF">D 符号：同一个逻辑值对象同时记录两条电路</h1>
<div class="figure-explainer">
  <figure>
    <img src="assets/ch05/d-symbol.svg" alt="D 和 D-bar 分别表示无故障与故障电路的一对值" />
  </figure>
  <div class="readout">
    <h3>如何读图</h3>
    <ul>
      <li>同样的输入同时作用于无故障和故障模型。</li>
      <li><code>D=1/0</code> 表示正常为 1、故障为 0。</li>
      <li><code>D̄=0/1</code> 表示正常为 0、故障为 1。</li>
    </ul>
    <p>D 不是第三个电压电平，而是一个便于推理的双电路状态记号。</p>
  </div>
</div>
<p><span class="source">[1] 故障传播与敏化基础见第 4 章，印刷页 161–248；诊断反向追踪见 7.2.2 节，印刷页 405–409</span></p>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E4%BB%BB%E4%BD%95%E6%95%85%E9%9A%9C%E5%8F%AF%E8%A7%81%E9%83%BD%E8%A6%81%E7%BB%8F%E8%BF%87%E6%BF%80%E6%B4%BB%E4%BC%A0%E6%92%AD%E5%8C%BA%E5%88%86">任何故障可见都要经过激活、传播、区分</h1>
<div class="flow">
  <div class="flow-step">激活故障</div>
  <div class="flow-step">产生 D / D̄</div>
  <div class="flow-step">敏化路径</div>
  <div class="flow-step">到达输出</div>
  <div class="flow-step">与期望区分</div>
</div>
<div class="grid-3">
  <div class="concept">
    <h3>激活</h3>
    <p>给故障位置施加能使其错误值显现的输入条件。</p>
  </div>
  <div class="concept">
    <h3>传播</h3>
    <p>沿路径给其他输入非控制值，让 D/D̄ 影响下游信号。</p>
  </div>
  <div class="concept">
    <h3>区分</h3>
    <p>使故障响应与无故障响应不同；仅激活但被掩盖，不等于可检测。</p>
  </div>
</div>
<p><span class="source">[1] 第 4 章故障敏化与 ATPG，印刷页 161–248；第 7 章诊断反向追踪，印刷页 405–409</span></p>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E7%BB%93%E6%9E%84%E8%A3%81%E5%89%AA%E5%85%88%E7%94%A8%E6%89%87%E5%85%A5%E9%94%A5%E5%88%A0%E6%8E%89%E6%A0%B9%E6%9C%AC%E5%88%B0%E4%B8%8D%E4%BA%86%E8%BE%93%E5%87%BA%E7%9A%84%E9%97%A8">结构裁剪：先用扇入锥删掉“根本到不了输出”的门</h1>
<div class="grid-2">
  <div class="concept">
    <h3>单故障假设</h3>
    <div class="formula">C<sub>single</sub> = ⋂ Cone(z<sub>i</sub>)</div>
    <p>一个根因必须共同影响所有失配输出，所以取所有失配输出扇入锥的交集。</p>
  </div>
  <div class="concept">
    <h3>多故障假设</h3>
    <div class="formula">C<sub>multi</sub> = ⋃ Cone(z<sub>i</sub>)</div>
    <p>不同输出可能由不同根因造成，所以任一失配输出的扇入锥都不能提前删除。</p>
  </div>
</div>
<div class="callout warning">交集更强，但多缺陷时可能为空；并集更安全，但候选区域更大。芯片的故障数未知，所以不能只看分辨率。</div>
<p><span class="source">[1] 7.2.2.1 节，例 7.6，印刷页 407–408</span></p>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E5%8F%8D%E5%90%91%E8%BF%BD%E8%B8%AA%E7%9A%84%E6%9C%AC%E8%B4%A8%E4%BB%8E%E5%BD%93%E5%89%8D%E8%BE%93%E5%87%BA%E5%80%BC%E5%AF%BB%E6%89%BE%E5%8F%AF%E7%BF%BB%E8%BD%AC%E7%9A%84%E8%BE%93%E5%85%A5">反向追踪的本质：从当前输出值寻找可翻转的输入</h1>
<div class="definition-box">
  <span class="term">敏化规则</span>
  <strong>只问：改变这个输入，能否改变当前门输出？</strong>
  <p>不能把某个口诀固定写在“输出为 0”或“输出为 1”上。应当结合门的控制值判断哪些扇入真正决定了当前输出。</p>
</div>
<div class="grid-2">
  <div class="concept">
    <h3>当前输出由控制输入决定</h3>
    <p>只保留承担控制值的扇入；其他输入没有左右当前输出。</p>
  </div>
  <div class="concept">
    <h3>当前输出由所有输入共同维持</h3>
    <p>所有扇入都可能解释翻转，必须继续向上追踪。</p>
  </div>
</div>
<div class="callout question">不要把一个固定 0/1 口诀套到所有门。请以“翻转一个输入能否改变输出”为唯一判据。</div>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E4%B8%80%E4%B8%AA%E5%8F%AF%E6%89%8B%E7%AE%97%E7%9A%84%E5%8F%8D%E5%90%91%E8%BF%BD%E8%B8%AA%E4%BE%8B%E5%AD%90">一个可手算的反向追踪例子</h1>
<div class="figure-explainer">
  <figure>
    <img src="assets/ch05/backtrace-example.svg" alt="AND、NAND 和 OR 电路中的反向追踪候选" />
  </figure>
  <div class="readout">
    <h3>如何读图</h3>
    <ul>
      <li>从无故障模型的 z=0 反向追踪；失败芯片 z=1。</li>
      <li>OR 输出为 0，两路扇入共同维持输出。</li>
      <li>AND 输出为 0，只有 A=0 是控制输入。</li>
      <li>NAND 输出为 0，C、D 两个输入都必须为 1。</li>
    </ul>
    <p>B=1 是非控制输入，不应仅因在同一门上就被保留。</p>
  </div>
</div>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E9%97%A8%E7%BA%A7%E6%95%8F%E5%8C%96%E8%A1%A8%E5%85%88%E8%AE%A9%E5%85%B6%E4%BB%96%E8%BE%93%E5%85%A5%E4%BF%9D%E6%8C%81%E9%9D%9E%E6%8E%A7%E5%88%B6%E5%80%BC">门级敏化表：先让其他输入保持非控制值</h1>
<table>
<thead>
<tr>
<th>门</th>
<th style="text-align:right">输入控制值</th>
<th style="text-align:right">传播某输入故障效应时，其他输入</th>
</tr>
</thead>
<tbody>
<tr>
<td>AND</td>
<td style="text-align:right">0</td>
<td style="text-align:right">1</td>
</tr>
<tr>
<td>NAND</td>
<td style="text-align:right">0</td>
<td style="text-align:right">1</td>
</tr>
<tr>
<td>OR</td>
<td style="text-align:right">1</td>
<td style="text-align:right">0</td>
</tr>
<tr>
<td>NOR</td>
<td style="text-align:right">1</td>
<td style="text-align:right">0</td>
</tr>
<tr>
<td>XOR</td>
<td style="text-align:right">无单一控制值</td>
<td style="text-align:right">由差分条件决定</td>
</tr>
</tbody>
</table>
<div class="callout">
  控制值会强制输出，使故障效应不易穿过；非控制值让其他输入保持敏化。反向追踪时再结合当前 CUD 值判断哪些扇入真正维持输出。
</div>
<p><span class="source">[1] 第 4 章门级敏化与 ATPG，印刷页 161–248；7.2.2.2 节，印刷页 408–409</span></p>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E4%BB%8E%E5%9B%BE%E5%88%B0%E5%80%99%E9%80%89%E6%AF%8F%E4%B8%AA%E5%A4%B1%E9%85%8D%E8%BE%93%E5%87%BA%E5%85%88%E5%BE%97%E5%88%B0%E8%87%AA%E5%B7%B1%E7%9A%84%E9%9B%86%E5%90%88">从图到候选：每个失配输出先得到自己的集合</h1>
<div class="candidate-strip">
  <span class="candidate keep">A</span>
  <span class="candidate drop">B</span>
  <span class="candidate keep">C</span>
  <span class="candidate keep">D</span>
</div>
<div class="worked-box">
  <div class="worked-step"><b>1</b><p><strong>单向量</strong> 反向追踪得到 {A,C,D}；这只是“可能影响输出”，还不是最终根因。</p></div>
  <div class="worked-step"><b>2</b><p><strong>多向量</strong> 在单故障假设下对所有失败向量取交集；若交集为空，转向多故障。</p></div>
  <div class="worked-step"><b>3</b><p><strong>下一步</strong> 对候选逐一注入故障值，检查能否复现实际 syndrome。</p></div>
</div>
<div class="callout warning">反向追踪只做必要性和结构可达性筛选，不保证每个保留候选都能解释全部证据。</div>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E6%B3%A8%E5%85%A5%E5%B9%B6%E8%AF%84%E4%BC%B0%E8%AE%A9%E6%AF%8F%E4%B8%AA%E5%80%99%E9%80%89%E5%B0%9D%E8%AF%95%E9%87%8D%E6%BC%94%E6%95%B4%E5%9C%BA%E5%A4%B1%E8%B4%A5">注入并评估：让每个候选尝试“重演整场失败”</h1>
<div class="flow">
  <div class="flow-step">无故障仿真</div>
  <div class="flow-step">取一个候选</div>
  <div class="flow-step">翻转/注入值</div>
  <div class="flow-step">传播新响应</div>
  <div class="flow-step">与实测比较</div>
</div>
<div class="grid-2">
  <div class="concept">
    <h3>需要保存什么</h3>
    <p>无故障信号值、失配输出、事件传播历史和每个候选的评估分数。</p>
  </div>
  <div class="concept">
    <h3>为什么可扩展</h3>
    <p>不必预计算所有故障签名；同一个无故障仿真结果可供多个候选复用，适合每个失败芯片单独分析。</p>
  </div>
</div>
<p><span class="source">[1] 7.2.2.3 节，印刷页 409–416</span></p>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E5%AE%9A%E4%B9%89%E4%B8%89%E4%B8%AA%E5%BF%85%E9%A1%BB%E5%8C%BA%E5%88%86%E7%9A%84%E8%AF%84%E4%BC%B0%E7%BB%93%E6%9E%9C">定义三个必须区分的评估结果</h1>
<div class="grid-3">
  <div class="concept">
    <h3>可修复输出</h3>
    <p>注入后某条原本失配的输出与失败芯片一致。</p>
  </div>
  <div class="concept">
    <h3>新失配输出</h3>
    <p>注入把原本正确的输出改坏了，说明候选制造了芯片未表现的行为。</p>
  </div>
  <div class="concept">
    <h3>可修复向量</h3>
    <p>该向量下所有原失配都被修复，且没有新增失配。条件最强。</p>
  </div>
</div>
<div class="formula">
  <span class="formula-label">启发式次级分数（教材示例）</span>
  rank<sub>2</sub> = 可修复输出数 − 0.5 × 新失配输出数
</div>
<p class="small">0.5 是教材给出的启发式权重，不是物理定律，也不能代替独立验证。</p>
<p><span class="source">[1] Definitions 7.5–7.7 与例 7.10，印刷页 411–416</span></p>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="47" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E6%89%8B%E7%AE%97-2%E4%BF%AE%E5%A4%8D%E4%B8%80%E4%B8%AA%E8%BE%93%E5%87%BA%E4%BD%86%E5%88%B6%E9%80%A0%E5%8F%A6%E4%B8%80%E4%B8%AA%E5%A4%B1%E9%85%8D">手算 2：修复一个输出但制造另一个失配</h1>
<div class="compare">
  <div class="compare-panel">
    <h3>观测</h3>
    <p>无故障模型：<code>(z1,z2)=(1,1)</code></p>
    <p>失败芯片：<code>(0,1)</code></p>
    <p>当前只有 z1 失配。</p>
  </div>
  <div class="compare-panel highlight">
    <h3>候选注入后</h3>
    <p>z1 从 1 变 0：修复 1 个输出。</p>
    <p>z2 从 1 变 0：新增 1 个失配。</p>
    <p><code>rank2 = 1 − 0.5 = 0.5</code></p>
  </div>
</div>
<div class="callout warning">在该向量下，候选不是“可修复向量”。它虽然解释了一部分效应，却制造了新效应，必须降权。</div>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="48" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E6%B3%A8%E5%85%A5%E5%88%86%E6%95%B0%E6%98%AF%E6%AF%94%E8%BE%83%E6%8C%87%E6%A0%87%E4%B8%8D%E6%98%AF%E7%89%A9%E7%90%86%E6%A6%82%E7%8E%87">注入分数是比较指标，不是物理概率</h1>
<div class="grid-3">
  <div class="concept">
    <h3>可修复向量数</h3>
    <p>严格满足“修复全部原失配且不增加新失配”的向量数量，优先级最高。</p>
  </div>
  <div class="concept">
    <h3>可修复输出数</h3>
    <p>候选改善了多少具体失配输出，可作为次级证据。</p>
  </div>
  <div class="concept">
    <h3>新增失配惩罚</h3>
    <p>候选制造了芯片未表现的新错误，应降低排序。</p>
  </div>
</div>
<div class="formula">
  <span class="formula-label">教材启发式</span>
  score = 可修复输出数 − 0.5 × 新增失配输出数
</div>
<div class="callout warning">分数来自当前注入模型和目标函数，不自动等于“候选为真实缺陷的概率”。</div>
<p><span class="source">[1] 7.2.2.3 节、Definitions 7.4–7.7 与例 7.10，印刷页 409–416</span></p>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="49" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E5%A4%9A%E7%BC%BA%E9%99%B7%E8%AE%A9%E4%B8%80%E4%B8%AA%E5%80%99%E9%80%89%E8%A7%A3%E9%87%8A%E5%85%A8%E9%83%A8%E8%AF%81%E6%8D%AE%E5%A4%B1%E6%95%88">多缺陷让“一个候选解释全部证据”失效</h1>
<div class="figure-explainer">
  <figure>
    <img src="assets/ch05/multi-defect.svg" alt="多个失配输出、重叠扇入锥与两个缺陷" />
  </figure>
  <div class="readout">
    <h3>如何读图</h3>
    <ul>
      <li>三个失配输出不等于三个独立故障。</li>
      <li>两个根因的扇入锥可以重叠。</li>
      <li>只取交集可能删掉真实缺陷；只按输出分组可能混合多个根因。</li>
    </ul>
  </div>
</div>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="50" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E4%B8%A4%E9%98%B6%E6%AE%B5%E8%8A%AF%E7%89%87%E7%BA%A7%E8%AF%8A%E6%96%AD%E5%85%88%E8%A7%A3%E9%87%8A%E5%86%8D%E9%87%8D%E5%88%86%E5%8C%BA">两阶段芯片级诊断：先解释，再重分区</h1>
<div class="flow">
  <div class="flow-step">结构裁剪</div>
  <div class="flow-step">寻找词级主候选</div>
  <div class="flow-step">删除被解释输出的完整扇入锥</div>
  <div class="flow-step">剩余依赖图分区</div>
  <div class="flow-step">逐块重复诊断</div>
</div>
<div class="grid-2">
  <div class="concept">
    <h3>为什么需要两阶段</h3>
    <p>多缺陷没有出现前，无法准确决定哪些候选属于同一个诊断块。</p>
  </div>
  <div class="concept">
    <h3>删除范围</h3>
    <p>删除词级主候选已经完整解释的失配输出所对应的整个扇入锥，而不是只删输出节点；否则共享结构仍会把诊断块粘在一起。</p>
  </div>
</div>
<p><span class="source">[1] 7.2.3 节，印刷页 418–425</span></p>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="51" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="sic%E4%B8%BB%E5%80%99%E9%80%89%E5%92%8C%E8%AF%8D%E7%BA%A7%E4%B8%BB%E5%80%99%E9%80%89%E5%9C%A8%E8%BF%87%E6%BB%A4%E4%BB%80%E4%B9%88">SIC、主候选和词级主候选在过滤什么？</h1>
<div class="grid-3">
  <div class="concept">
    <h3>SIC 点</h3>
    <p>对每一个失败向量，该信号可达的全部失配输出都能被部分修复。它仍可能是 aliasing 候选，不等于结构上独立。</p>
  </div>
  <div class="concept">
    <h3>主候选</h3>
    <p>其可达输出集合不是另一个 SIC 点的真子集，减少被更上游候选覆盖的重复项。</p>
  </div>
  <div class="concept">
    <h3>词级主候选</h3>
    <p>要求候选能解释其输出组内的全部失配，进一步过滤局部 alias。</p>
  </div>
</div>
<div class="callout warning">教材报告过从 72.3 个主候选降到 3.7 个词级候选的历史案例，但那是特定设计数据，不能当作本课程或你项目的预期收益。</div>
<p><span class="source">[1] Definitions 7.8–7.12，印刷页 420–425</span></p>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="52" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E8%AF%8A%E6%96%AD-atpg%E4%B8%BB%E5%8A%A8%E5%88%B6%E9%80%A0%E5%8F%AA%E5%9C%A8%E8%BF%99%E4%B8%A4%E4%B8%AA%E5%80%99%E9%80%89%E9%97%B4%E4%B8%8D%E5%90%8C%E7%9A%84%E5%90%91%E9%87%8F">诊断 ATPG：主动制造“只在这两个候选间不同”的向量</h1>
<div class="compare">
  <div class="compare-panel">
    <h3>覆盖率测试</h3>
    <p>目标是检测故障：有故障与无故障是否不同？</p>
    <p>一个向量可以检测很多故障，但未必能把它们区分开。</p>
  </div>
  <div class="compare-panel highlight">
    <h3>诊断测试</h3>
    <p>目标是区分假设：候选 f1 与 f2 的输出是否不同？</p>
    <p>需要构造能产生不同响应签名的新向量。</p>
  </div>
</div>
<div class="formula">
  <span class="formula-label">诊断等价</span>
  f1 ≡<sub>V</sub> f2  ⇔  对所有 v ∈ V，Response(f1,v) = Response(f2,v)
</div>
<p><span class="source">[1] 7.2.4 节，Definition 7.13，印刷页 425–426</span></p>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="53" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E6%89%8B%E7%AE%97-3%E7%94%A8%E5%BC%82%E6%88%96%E5%A4%B9%E5%85%B7%E8%BF%9E%E6%8E%A5%E4%B8%A4%E4%B8%AA%E5%80%99%E9%80%89%E6%A8%A1%E5%9E%8B">手算 3：用异或“夹具”连接两个候选模型</h1>
<div class="flow">
  <div class="flow-step">复制两份 CUD</div>
  <div class="flow-step">分别注入 f1 / f2</div>
  <div class="flow-step">对应输出异或</div>
  <div class="flow-step">所有异或送 OR</div>
  <div class="flow-step">检测 miter 输出 z/0</div>
</div>
<div class="grid-2">
  <div class="concept">
    <h3>若 ATPG 找到向量</h3>
    <p>至少一个输出不同，该向量可把 f1 与 f2 放入不同诊断组。</p>
  </div>
  <div class="concept">
    <h3>若 ATPG 无解</h3>
    <p>在该 ATPG 模型和约束下，两候选不可区分；报告应写“当前模型下等价”，不能写成物理等价。</p>
  </div>
</div>
<div class="callout">诊断向量解决的是“证据设计”，不是提高制造测试覆盖率。</div>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="54" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E6%A1%A5%E6%8E%A5%E6%95%85%E9%9A%9C%E4%B8%8D%E5%8F%AA%E6%98%AF%E4%B8%A4%E4%B8%AA%E8%8A%82%E7%82%B9%E9%83%BD%E5%8D%A1%E4%BD%8F">桥接故障不只是“两个节点都卡住”</h1>
<div class="grid-3">
  <div class="concept">
    <h3>AND 型桥接</h3>
    <p>被短接信号表现为逻辑 AND 的投票关系。一个强 0 可能覆盖其他节点的 1。</p>
  </div>
  <div class="concept">
    <h3>OR 型桥接</h3>
    <p>被短接信号表现为逻辑 OR 的投票关系。一个强 1 可能覆盖其他节点的 0。</p>
  </div>
  <div class="concept">
    <h3>Dominant 桥接</h3>
    <p>某个驱动器占主导，使另一个受害节点跟随其值；故障可能随输入条件改变表现。</p>
  </div>
</div>
<div class="callout warning">桥接缺陷在不同向量、驱动强度和方向上可能产生不同受害者信号，因此单固定型签名经常无法精确解释。</div>
<p><span class="source">[1] 7.2.5 节与练习 7.3，印刷页 427、451</span></p>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="55" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E6%A1%A5%E6%8E%A5%E6%95%85%E9%9A%9C%E8%AF%8A%E6%96%AD%E5%8D%95%E7%82%B9%E4%BF%AE%E5%A4%8D%E8%A1%A8%E5%A6%82%E4%BD%95%E7%BB%84%E5%90%88%E6%88%90%E4%BF%A1%E5%8F%B7%E9%9B%86%E5%90%88">桥接故障诊断：单点修复表如何组合成信号集合</h1>
<div class="grid-2">
  <div class="concept">
    <h3>SLAT 的第一层</h3>
    <p>对每个失败向量和候选信号做单点注入，记录哪些修改能修复全部失配，形成失败向量 × 候选表。</p>
  </div>
  <div class="concept">
    <h3>SLAT 的第二层</h3>
    <p>寻找其 SLAT 向量并集覆盖全部失败向量的候选信号组（fault multiplet）；先从单点开始，再尝试两点或更高阶组合。</p>
  </div>
</div>
<div class="flow">
  <div class="flow-step">失败向量</div>
  <div class="flow-step">单点可修复表</div>
  <div class="flow-step">SLAT 向量并集</div>
  <div class="flow-step">故障多重项</div>
</div>
<p>桥接缺陷在不同测试条件下可能表现为不同受害者信号，因此不能简单把它当作一个固定型故障。</p>
<p><span class="source">[1] 7.2.2.3 与 7.2.5 节，例 7.11，印刷页 416–418、427</span></p>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="56" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E4%B8%80%E4%BB%BD%E5%A4%9A%E7%BC%BA%E9%99%B7%E8%AF%8A%E6%96%AD%E6%8A%A5%E5%91%8A%E5%BA%94%E5%8C%85%E5%90%AB%E4%BB%80%E4%B9%88">一份多缺陷诊断报告应包含什么？</h1>
<table>
<thead>
<tr>
<th>内容</th>
<th>必要证据</th>
<th>不能省略的风险</th>
</tr>
</thead>
<tbody>
<tr>
<td>候选区域</td>
<td>扇入锥或分区来源</td>
<td>交集为空、多缺陷并集过大</td>
</tr>
<tr>
<td>候选排序</td>
<td>可修复向量、可修复输出、惩罚项</td>
<td>权重是启发式，不是概率</td>
</tr>
<tr>
<td>竞争原因</td>
<td>未解释输出、诊断等价类</td>
<td>不能只报最高分候选</td>
</tr>
<tr>
<td>主动测试</td>
<td>诊断 ATPG 或新的区分向量</td>
<td>模型外缺陷仍不可区分</td>
</tr>
<tr>
<td>下一步</td>
<td>物理检查顺序与预期位置</td>
<td>逻辑候选不等于根因证明</td>
</tr>
</tbody>
</table>
<div class="callout question">报告的目标不是显得确定，而是让下一位工程师知道为什么相信、为什么怀疑、下一步怎么反驳。</div>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-header="超大规模集成电路测试基础" data-footer="第 5 章 · 逻辑诊断" data-theme="vlsi-testing" lang="en-US" data-marpit-pagination="57" style="--paginate:true;--header:超大规模集成电路测试基础;--footer:第 5 章 · 逻辑诊断;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<header>超大规模集成电路测试基础</header>
<h1 id="%E7%AC%AC%E4%BA%8C%E8%AF%BE%E7%BB%93%E8%AE%BA%E5%8A%A8%E6%80%81%E6%8E%A8%E7%90%86%E8%A7%A3%E5%86%B3%E7%9A%84%E6%98%AF%E5%AD%97%E5%85%B8%E5%A4%96%E5%92%8C%E5%A4%9A%E5%8E%9F%E5%9B%A0">第二课结论：动态推理解决的是“字典外”和“多原因”</h1>
<div class="takeaways">
  <li>结构裁剪先把网表缩小到与失配输出相关的扇入锥。</li>
  <li>反向追踪根据当前门值和敏化条件继续做功能裁剪，不能靠错误口诀。</li>
  <li>注入评估要求候选解释原失配且不制造新失配，可修复向量是最强证据。</li>
  <li>多缺陷需要先解释独立原因、再重分区，不能直接把失配输出分成相同数量的故障。</li>
  <li>诊断 ATPG 主动生成区分证据，但结论仍受 ATPG 模型和故障假设限制。</li>
</div>
<footer>第 5 章 · 逻辑诊断</footer>
</section>

<header>超大规模集成电路测试基础</header>
<h1 id="%E7%A6%BB%E5%A0%82%E9%A2%98-2%E4%BF%9D%E7%95%99%E4%B8%A4%E4%B8%AA%E5%81%87%E8%AE%BE%E8%80%8C%E4%B8%8D%E6%98%AF%E7%BC%96%E9%80%A0%E4%B8%80%E4%B8%AA%E7%AD%94%E6%A1%88">离堂题 2：保留两个假设，而不是编造一个答案</h1>
<div class="exit-card">
  <h2>给定候选 A、B 与三个失败向量</h2>
  <ol>
    <li>A 在 v1、v2 上是可修复向量，在 v3 上制造新失配；B 在 v1、v3 上是可修复向量。</li>
    <li>写出两者的排名依据和保留理由。</li>
    <li>设计一个能把 A、B 分开的诊断向量目标。</li>
    <li>如果真实芯片有两个缺陷，单故障交集会发生什么？</li>
    <li>报告中还应写哪两项“尚不能证明”的事实？</li>
  </ol>
</div>
<div class="callout question">下一课：当扫描链把单个单元的错误扩散成整段位流，或 BIST 把全部响应压成一个签名时，怎样找回被丢掉的时间与空间信息？</div>
<footer>第 5 章 · 逻辑诊断</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-footer="第 5 章 · 逻辑诊断" data-class="divider" data-theme="vlsi-testing" lang="en-US" class="divider" data-marpit-pagination="59" style="--paginate:true;--footer:第 5 章 · 逻辑诊断;--class:divider;--theme:vlsi-testing;" data-marpit-pagination-total="90" data-size="16:9">
<h1 id="%E7%AC%AC%E4%B8%89%E8%8A%82%E8%AF%BE--45-%E5%88%86%E9%92%9F">第三节课 · 45 分钟</h1>
<h2 id="%E9%A6%96%E7%A1%85%E6%89%AB%E6%8F%8F%E9%93%BE%E4%B8%8E%E5%8E%8B%E7%BC%A9-bist-%E8%AF%8A%E6%96%AD">首硅扫描链与压缩 BIST 诊断</h2>
<p>从快照/观测图像到区间、二分定位和确定性掩码。</p>
<footer>第 5 章 · 逻辑诊断</footer>
